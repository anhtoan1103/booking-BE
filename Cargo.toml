[package]
name = "backend"
version = "0.1.0"
edition = "2021"

[dependencies]
actix-web = "4"         # Web framework
actix-cors = "0.7"
anyhow = "1.0.97"
async-std = "1.13.1"
dotenv = "0.15.0"
postgres = "0.19.10"
sqlx = { version = "0.8.3", features = ["postgres", "runtime-tokio", "macros", "runtime-tokio-native-tls"] }
tokio = { version = "1.44.1", features = ["macros", "rt-multi-thread", "full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bcrypt = "0.15"
jsonwebtoken = "9"
once_cell = "1.17.1"
chrono = { version = "0.4", features = ["serde"] }
